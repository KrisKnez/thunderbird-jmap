<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add JMAP account</title>
    <link rel="stylesheet" href="setup.css" />
    <script src="setup.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Add a JMAP account</h1>
      <p class="lead">Connect a mail account on a JMAP server, such as Stalwart, Fastmail or Cyrus.</p>

      <form id="setup-form" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="auth-kind">Sign in with</label>
        <select id="auth-kind" name="authKind">
          <option value="basic">Password</option>
          <option value="bearer">API token</option>
        </select>

        <label for="secret" id="secret-label">Password</label>
        <input id="secret" name="secret" type="password" autocomplete="current-password" required />

        <details id="advanced">
          <summary>Advanced</summary>
          <label for="session-url">Session URL</label>
          <input
            id="session-url"
            name="sessionUrl"
            type="url"
            placeholder="https://mail.example.com/.well-known/jmap"
            autocomplete="off"
          />
          <p class="hint">Leave empty to find it from your email address.</p>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" />
          <p class="hint">Leave empty to use your email address.</p>
        </details>

        <button id="submit" type="submit">Add account</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
